# Build .apk SETARA (PB18) di GitHub Actions — tidak perlu Android Studio di laptop.
# Hasil: tab Actions → run terbaru → Artifacts → "setara-debug-apk".
name: Build APK Android

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

jobs:
  apk:
    # Image Ubuntu 24.04 sudah berisi Android SDK (ANDROID_HOME) dengan lisensi diterima
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Gradle assembleDebug
        working-directory: android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log
      # Ringkasan galat sebagai anotasi (terbaca tanpa login di halaman run)
      - name: Ringkas galat Gradle
        if: failure()
        working-directory: android
        run: |
          { grep -A 30 "What went wrong" gradle.log | head -60; grep -E "error:|^e: " gradle.log | head -30; } > err.txt || true
          echo "::error title=Gradle assembleDebug::$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' err.txt | cut -c1-8000)"
      - uses: actions/upload-artifact@v4
        with:
          name: setara-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
